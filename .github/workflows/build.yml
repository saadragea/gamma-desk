name: Build gamma dashboard

# Every 5 minutes on weekdays, 13:00-21:59 UTC (covers 09:25-16:20 New York in winter and
# summer); outside those hours a scheduled run stops at once. A push or a manual run always
# builds. Public repository, so Actions minutes cost nothing.
on:
  schedule:
    - cron: "*/5 13-21 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      skip: ${{ steps.build.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - id: pages
        uses: actions/configure-pages@v6
      - id: build
        env:
          SCHEDULED: ${{ github.event_name == 'schedule' }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          FLAG=""
          if [ "$SCHEDULED" = "true" ]; then FLAG="--only-in-session"; fi
          python -m gammadesk.build --out site/data --fallback-url "$SITE_URL" $FLAG
      - if: steps.build.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
