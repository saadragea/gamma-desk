[project]
name = "gamma-desk"
version = "0.1.0"
description = "Dealer gamma dashboard (SPX, SPY, QQQ and large US stocks) from free Cboe delayed option data"
requires-python = ">=3.12"
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
